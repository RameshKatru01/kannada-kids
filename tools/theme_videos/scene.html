<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: "Baloo"; src: local("Baloo Tamma 2"); }
  html { background: var(--fade, #fff); }
  html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; }
  body { font-family: "Baloo Tamma 2", sans-serif; position: relative; }
  #bg { position: absolute; inset: 0; }
  .blob { position: absolute; border-radius: 50%; opacity: .35; }
  #burst { position: absolute; left: 340px; top: 390px; width: 900px; height: 900px; margin: -450px 0 0 -450px; opacity: .22; }
  #chip { position: absolute; left: 36px; top: 28px; padding: 6px 26px 2px; border-radius: 40px; background: rgba(255,255,255,.88);
          font-weight: 800; font-size: 40px; color: var(--ink); box-shadow: 0 6px 0 rgba(0,0,0,.08); white-space: nowrap; }
  #chip small { font-size: 26px; font-weight: 700; opacity: .7; margin-left: 10px; }
  #pics { position: absolute; left: 0; top: 0; width: 760px; height: 720px; }
  .pic { position: absolute; transform-origin: 50% 90%; }
  .pic img { width: 100%; height: 100%; filter: drop-shadow(0 18px 14px rgba(0,0,0,.18)); }
  .tag { position: absolute; left: 50%; bottom: -54px; transform: translateX(-50%); background: #fff; color: var(--ink);
         font-weight: 800; font-size: 30px; padding: 2px 18px 0; border-radius: 24px; white-space: nowrap; }
  #shadow { position: absolute; left: 340px; top: 640px; width: 300px; height: 34px; margin-left: -150px; border-radius: 50%; background: rgba(0,0,0,.12); }
  #word { position: absolute; left: 930px; top: 170px; width: 560px; margin-left: -280px; text-align: center; transform-origin: 50% 60%; }
  #kn { font-weight: 800; color: var(--ink); line-height: 1.4; white-space: nowrap; display: inline-block;
        text-shadow: 0 6px 0 rgba(255,255,255,.9); }
  #en { font-weight: 700; font-size: 50px; color: var(--ink2); margin-top: 4px; }
  #sentence { position: absolute; left: 50%; top: 600px; transform: translateX(-50%); background: #fff; color: var(--ink);
              border-radius: 50px; padding: 10px 44px 4px; font-size: 52px; font-weight: 800; white-space: nowrap;
              box-shadow: 0 8px 0 rgba(0,0,0,.08); }
  #say { position: absolute; left: 960px; top: 490px; width: 460px; margin-left: -230px; text-align: center; }
  #saybox { display: inline-flex; align-items: center; gap: 14px; background: var(--accent); color: #fff; border-radius: 50px;
            padding: 8px 30px 2px 14px; font-size: 50px; font-weight: 800; box-shadow: 0 8px 0 rgba(0,0,0,.12); }
  #saybox img { width: 70px; height: 70px; margin-bottom: 6px; }
  #dots { margin-top: 18px; display: flex; gap: 18px; justify-content: center; }
  #dots i { width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,.7); border: 4px solid var(--accent); }
  #bravo { position: absolute; left: 640px; top: 330px; transform: translate(-50%,-50%); text-align: center; }
  #bravo b { display: inline-block; font-size: 150px; font-weight: 800; color: #fff; -webkit-text-stroke: 10px var(--accent);
             paint-order: stroke fill; text-shadow: 0 12px 0 rgba(0,0,0,.12); }
  #stars img { position: absolute; width: 90px; height: 90px; }
  #ring { position: absolute; border-radius: 50%; border: 10px solid var(--accent); }
</style></head>
<body>
<div id="bg"></div>
<svg id="burst" viewBox="-50 -50 100 100"></svg>
<div id="chip"></div>
<div id="shadow"></div>
<div id="pics"></div>
<div id="ring"></div>
<div id="word"><div id="kn"></div><div id="en"></div></div>
<div id="sentence"></div>
<div id="say"><div id="saybox"><img src="pics/emoji_u1f3a4.png"><span>ನೀನೂ ಹೇಳು!</span></div><div id="dots"><i></i><i></i><i></i></div></div>
<div id="bravo"><b>ಶಭಾಷ್!</b></div>
<div id="stars"></div>
<script>
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - Math.pow(1 - t, 3);
// springy pop: 0 → overshoot → 1
const pop = t => t <= 0 ? 0 : t >= 1 ? 1 : 1 - Math.exp(-6 * t) * Math.cos(10 * t);
let S, T;

function setup(spec) {
  S = spec; T = spec.times;
  const th = spec.theme;
  document.body.style.setProperty('--ink', th.ink);
  document.body.style.setProperty('--ink2', th.ink2);
  document.body.style.setProperty('--accent', th.accent);
  document.documentElement.style.setProperty('--fade', th.bg2);
  $('bg').style.background = `radial-gradient(circle at 30% 45%, ${th.bg1} 0%, ${th.bg2} 75%)`;
  // soft blobs
  const rnd = mulberry(spec.seed);
  window.blobs = [];
  for (let i = 0; i < 9; i++) {
    const d = document.createElement('div'); d.className = 'blob';
    const s = 60 + rnd() * 160; d.style.width = d.style.height = s + 'px';
    d.style.background = th.blobs[i % th.blobs.length];
    $('bg').appendChild(d);
    blobs.push({ d, x: rnd() * 1280, y: rnd() * 720, s, sp: .3 + rnd() * .6, ph: rnd() * 6.28 });
  }
  // sun burst
  let rays = '';
  for (let i = 0; i < 16; i++) {
    const a = i * Math.PI / 8, b = a + Math.PI / 16;
    rays += `<path d="M0 0 L${60 * Math.cos(a)} ${60 * Math.sin(a)} L${60 * Math.cos(b)} ${60 * Math.sin(b)} Z" fill="#fff"/>`;
  }
  $('burst').innerHTML = rays;
  $('chip').innerHTML = `${th.kn}<small>${th.en}</small>`;
  // pictures
  spec.pics.forEach(p => {
    const d = document.createElement('div'); d.className = 'pic';
    d.style.width = d.style.height = p.size + 'px';
    d.style.left = (p.x - p.size / 2) + 'px'; d.style.top = (p.y - p.size / 2) + 'px';
    d.innerHTML = `<img src="pics/${p.file}">` + (p.tag ? `<div class="tag">${p.tag}</div>` : '');
    $('pics').appendChild(d); p.el = d;
  });
  $('kn').textContent = spec.kn; $('en').textContent = spec.en;
  $('sentence').textContent = spec.sentence;
  // fit the Kannada word in 500px
  let fs = 150; $('kn').style.fontSize = fs + 'px';
  while ($('kn').getBoundingClientRect().width > 540 && fs > 40) { fs -= 4; $('kn').style.fontSize = fs + 'px'; }
  // stars for the end
  window.stars = [];
  for (let i = 0; i < 14; i++) {
    const im = document.createElement('img');
    im.src = 'pics/' + (i % 3 == 0 ? 'emoji_u2728.png' : i % 3 == 1 ? 'emoji_u2b50.png' : 'emoji_u1f31f.png');
    $('stars').appendChild(im);
    const a = i / 14 * 6.28 + rnd() * .3;
    stars.push({ im, a, r: 260 + rnd() * 180, s: .6 + rnd() * .6, spin: (rnd() - .5) * 400 });
  }
}

function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function render(t) {
  // background drift
  blobs.forEach(b => {
    const x = (b.x + t * 25 * b.sp) % 1400 - 60, y = b.y + Math.sin(t * b.sp + b.ph) * 20;
    b.d.style.transform = `translate(${x}px, ${y}px)`;
  });
  $('burst').style.transform = `rotate(${t * 12}deg) scale(${easeOut(clamp(t / 0.8))})`;
  // chip slides in
  const c = easeOut(clamp(t / 0.6));
  $('chip').style.transform = `translateY(${lerp(-120, 0, c)}px)`;
  // pictures pop in, then bob
  S.pics.forEach((p, i) => {
    const k = pop(clamp((t - T.pic - i * 0.15) / 0.9));
    const bob = t > T.pic + 1 ? Math.sin((t - T.pic) * 2.6 + i) * 8 : 0;
    // bounce on each spoken word
    let hop = 0;
    for (const w of [T.word1, T.word2]) { const u = (t - w) / 0.5; if (u > 0 && u < 1) hop = Math.max(hop, Math.sin(u * Math.PI) * 30); }
    p.el.style.transform = `translateY(${bob - hop}px) scale(${k}) rotate(${Math.sin(t * 1.7 + i) * 3}deg)`;
  });
  $('shadow').style.transform = `scale(${pop(clamp((t - T.pic) / 0.9))})`;
  $('shadow').style.opacity = S.pics.length > 1 ? 0 : 1;
  // the word
  const w = pop(clamp((t - T.word1) / 0.7));
  let glow = 0;
  const u2 = (t - T.word2) / 0.6; if (u2 > 0 && u2 < 1) glow = Math.sin(u2 * Math.PI);
  $('word').style.transform = `scale(${w * (1 + glow * 0.15)})`;
  $('word').style.opacity = clamp((t - T.word1) * 6);
  $('kn').style.color = glow > 0 ? S.theme.accent : '';
  $('en').style.opacity = clamp((t - T.word1 - 0.4) * 3);
  // sentence pill
  const s = pop(clamp((t - T.sentence) / 0.6));
  const sOut = clamp((t - T.say + 0.2) * 4);
  $('sentence').style.transform = `translateX(-50%) translateY(${(1 - s) * 140 + sOut * 160}px)`;
  // "say it" + 3 dots
  const y = pop(clamp((t - T.say) / 0.6)) * (1 - clamp((t - T.word2 - 0.2) * 4));
  $('say').style.transform = `scale(${y})`;
  [...$('dots').children].forEach((d, i) => { d.style.background = t > T.pause + i * (T.pauseLen / 3) ? S.theme.accent : 'rgba(255,255,255,.7)'; });
  // ring pulses around the word during the pause
  const r = $('ring');
  if (t > T.pause && t < T.word2) {
    const ph = ((t - T.pause) % 1);
    const R = 260 + ph * 120;
    r.style.display = 'block'; r.style.width = r.style.height = R + 'px';
    r.style.left = (930 - R / 2) + 'px'; r.style.top = (300 - R / 2) + 'px'; r.style.opacity = 0.5 * (1 - ph);
  } else r.style.display = 'none';
  // bravo
  const b = pop(clamp((t - T.bravo) / 0.7));
  $('bravo').style.transform = `translate(-50%,-50%) scale(${b}) rotate(${Math.sin(t * 6) * 3 * b}deg)`;
  $('bravo').style.opacity = b > 0 ? 1 : 0;
  $('pics').style.opacity = 1 - clamp((t - T.bravo) * 3) * 0.75;
  if (t > T.bravo) $('word').style.opacity = 1 - clamp((t - T.bravo) * 4);
  stars.forEach(st => {
    const k = clamp((t - T.bravo) / 1.2);
    const e = easeOut(k);
    st.im.style.display = k > 0 ? 'block' : 'none';
    const x = 640 + Math.cos(st.a) * st.r * e - 45, yy = 330 + Math.sin(st.a) * st.r * e * 0.75 - 45 + k * k * 60;
    st.im.style.transform = `translate(${x}px, ${yy}px) scale(${st.s * (k < .1 ? k * 10 : 1)}) rotate(${st.spin * k}deg)`;
    st.im.style.opacity = 1 - clamp((t - T.bravo - 1.4) * 2);
  });
  // fade out at the very end
  document.body.style.opacity = 1 - clamp((t - (T.end - 0.4)) / 0.4);
}
</script>
</body></html>
