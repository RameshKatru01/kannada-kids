name: Generate voice

# Run by hand (Actions > Generate voice > Run workflow). Makes the Kannada voice clips with
# Google Cloud Text-to-Speech and commits them to the app. Needs the repository secret
# GOOGLE_TTS_API_KEY.
on:
  workflow_dispatch:
    inputs:
      voice:
        description: 'Voice name (e.g. kn-IN-Wavenet-A) or "auto"'
        default: auto
      rate:
        description: 'Speaking speed (1.0 = normal; 0.85 is a little slower for kids)'
        default: '0.85'
      force:
        description: 'Make every clip again (e.g. after changing the voice)'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare Firebase config
        shell: bash
        run: |
          # The unit test build needs a google-services.json (the real one is committed)
          test -f composeApp/google-services.json || echo "google-services.json missing"
      - name: List every phrase the app says
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew :composeApp:testDebugUnitTest --tests "com.example.SpeechCatalogExport" --rerun --no-build-cache --console=plain --stacktrace 2>&1 | tee voice.log
          wc -l composeApp/build/voice/phrases.tsv
      - name: Make the voice clips
        env:
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          # Inputs go through env (not pasted into the script) so typed text can't run as commands
          VOICE: ${{ inputs.voice }}
          RATE: ${{ inputs.rate }}
          FORCE: ${{ inputs.force }}
        run: |
          [[ "$VOICE" =~ ^[A-Za-z0-9-]+$ ]] || { echo "Voice must be a name like kn-IN-Wavenet-A or auto"; exit 1; }
          [[ "$RATE" =~ ^[0-9]+(\.[0-9]+)?$ ]] || { echo "Speed must be a number like 0.85"; exit 1; }
          args=(--voice "$VOICE" --rate "$RATE" --prune)
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          set -o pipefail
          python3 tools/generate_voice.py "${args[@]}" 2>&1 | tee -a voice.log
      - name: Commit the clips and build a new APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add composeApp/src/commonMain/composeResources/files/voice tools/voice-index.tsv
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Voice clips (Google Cloud Text-to-Speech)"
          git push
          gh workflow run build-apk.yml --ref "${GITHUB_REF_NAME}"
      - name: Publish the error log (branch voice-logs)
        if: failure()
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/logs
          { echo "Run ${{ github.run_id }}  Commit ${{ github.sha }}"; grep -E "^e: |error|Error|FAILED|What went wrong|Exception|GOOGLE|Google TTS" -A4 voice.log | head -150; echo "===== tail ====="; tail -80 voice.log; } > /tmp/logs/voice-errors.txt 2>&1
          find composeApp/build -path "*test-results*" -name "*.xml" -exec cat {} \; 2>/dev/null | head -150 >> /tmp/logs/voice-errors.txt
          cd /tmp/logs && git init -q && git checkout -q -b voice-logs
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add . && git commit -qm "voice log" && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" voice-logs
