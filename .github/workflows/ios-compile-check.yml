name: iOS compile check

# Run by hand (Actions > iOS compile check > Run workflow). macOS minutes cost more, so not on every push.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile Kotlin for iOS
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew :composeApp:compileKotlinIosSimulatorArm64 --stacktrace --console=plain 2>&1 | tee build.log
      - name: Build the iOS app (Swift + Kotlin, simulator, no signing)
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project iosApp/iosApp.xcodeproj -target iosApp -configuration Debug \
            -sdk iphonesimulator -arch arm64 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tee xcode.log | grep -E "error:|warning: .*Swift|BUILD (SUCCEEDED|FAILED)" | head -100
      - name: Publish build errors
        if: failure()
        shell: bash
        run: |
          { echo "Run: ${{ github.run_id }}  Commit: ${{ github.sha }}"; echo "===== errors ====="; grep -E "^e: |error:|FAILURE|What went wrong" -A3 build.log | head -200; echo "===== xcode ====="; grep -E "error:" -A3 xcode.log 2>/dev/null | head -200; } > build-errors.txt
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan build-logs-ios
          git rm -rf --cached . > /dev/null
          git add build-errors.txt
          git commit -m "iOS build errors for ${{ github.sha }}"
          git push -f origin build-logs-ios
