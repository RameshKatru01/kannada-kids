name: iOS compile check

# Run by hand (Actions > iOS compile check > Run workflow). macOS minutes cost more, so not on every push.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile Kotlin for iOS
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew :composeApp:compileKotlinIosSimulatorArm64 --stacktrace --console=plain 2>&1 | tee build.log
      - name: Build the iOS app (Swift + Kotlin, simulator, no signing)
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -destination 'generic/platform=iOS Simulator' ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tee xcode.log | grep -E "error:|warning: .*Swift|BUILD (SUCCEEDED|FAILED)" | head -100
      - name: Publish build errors
        if: failure()
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/logs
          {
            echo "Run: ${{ github.run_id }}  Commit: ${{ github.sha }}"
            echo "===== kotlin errors ====="
            grep -E "^e: |FAILURE|What went wrong" -A3 build.log | head -100
            echo "===== xcode errors ====="
            grep -E "error:" xcode.log | sort | uniq -c | sort -rn | head -60
            echo "===== xcode log tail ====="
            tail -120 xcode.log
          } > /tmp/logs/build-errors.txt 2>&1
          cd /tmp/logs
          git init -q
          git checkout -q -b build-logs-ios
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add build-errors.txt
          git commit -qm "iOS build errors for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" build-logs-ios
