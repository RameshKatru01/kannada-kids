name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Use Firebase settings from repository secrets (if set)
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          WEB_CLIENT_ID: ${{ secrets.WEB_CLIENT_ID }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > composeApp/google-services.json
            echo "Using google-services.json from secrets"
          fi
          if [ -n "$WEB_CLIENT_ID" ]; then
            echo "WEB_CLIENT_ID=$WEB_CLIENT_ID" > .env
            echo "Using WEB_CLIENT_ID from secrets"
          fi

      - name: Build debug APK
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew :composeApp:assembleDebug --stacktrace --console=plain 2>&1 | tee build.log

      - uses: actions/upload-artifact@v4
        with:
          name: KannadaKids-debug-apk
          path: composeApp/build/outputs/apk/debug/*.apk
          retention-days: 5

      # If the build fails, save the important part of the log to the "build-logs" branch
      # so it can be read without opening the Actions web page.
      - name: Publish build errors
        if: failure()
        shell: bash
        run: |
          {
            echo "Run: ${{ github.run_id }}  Commit: ${{ github.sha }}"
            echo "===== errors ====="
            grep -E "^e: |^w: .*error|error:|What went wrong|Could not |Unresolved|FAILURE|BUILD FAILED|> " build.log | head -400 || true
            echo "===== last 250 lines ====="
            tail -250 build.log
          } > build-errors.txt
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan build-logs
          git rm -r -q --cached . || true
          git add -f build-errors.txt
          git commit -q -m "Build errors for run ${{ github.run_id }}"
          git push -f origin build-logs
