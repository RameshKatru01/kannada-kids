name: Deploy backend (Firebase rules + subscription checks)

# Run by hand: Actions > "Deploy backend" > Run workflow.
# Publishes firestore.rules, storage.rules and the Cloud Function in functions/ to project
# kannadakids-fd92d. Needs the repository secret FIREBASE_DEPLOY_KEY: a service-account JSON key
# with the roles "Firebase Admin", "Cloud Functions Admin", "Service Account User",
# "Cloud Build Editor" and "Artifact Registry Administrator".
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_DEPLOY_KEY }}
      - name: Install the function's packages
        run: npm install --prefix functions --omit=dev --no-audit --no-fund
      - name: Deploy
        run: npx --yes firebase-tools@14 deploy --only functions,firestore:rules,storage --project kannadakids-fd92d --non-interactive --force
