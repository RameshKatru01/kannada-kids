name: Build release (AAB for Google Play)

# Run by hand: Actions > "Build release (AAB for Google Play)" > Run workflow.
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   RELEASE_KEYSTORE_BASE64  - the upload key file (funlearn-upload-key.jks) as base64 text
#   RELEASE_STORE_PASSWORD   - its password
# Every run gets a higher versionCode (100 + run number), as Google Play requires.

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name shown to users (e.g. 1.2)'
        required: true
        default: '1.2'

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Get the upload key
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::Secret RELEASE_KEYSTORE_BASE64 is missing (see the top of this file)."
            exit 1
          fi
          # Take the long base64 line only, in case a label or note was copied along with it
          CLEAN=$(printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr '\r\t' '  ' | grep -oE '[A-Za-z0-9+/=]{1000,}' | head -1)
          echo "Key text length: ${#CLEAN} characters (the right one is 5816)"
          if ! printf '%s' "$CLEAN" | base64 -d > "$RUNNER_TEMP/upload-key.jks" 2>/dev/null; then
            echo "::error::RELEASE_KEYSTORE_BASE64 isn't valid. Paste only the one long line from the key details file (nothing before or after it)."
            exit 1
          fi
          echo "KEYSTORE_PATH=$RUNNER_TEMP/upload-key.jks" >> "$GITHUB_ENV"

      - name: Use Firebase settings from repository secrets (if set)
        shell: bash
        env:
          WEB_CLIENT_ID: ${{ secrets.WEB_CLIENT_ID }}
        run: |
          if [ -n "$WEB_CLIENT_ID" ]; then
            echo "WEB_CLIENT_ID=$WEB_CLIENT_ID" > .env
          fi

      - name: Build signed AAB
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          export VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))
          chmod +x ./gradlew
          echo "Building version $VERSION_NAME (code $VERSION_CODE)"
          ./gradlew :composeApp:bundleRelease --stacktrace --console=plain
          # Make sure the bundle really is signed with the upload key
          jarsigner -verify -certs composeApp/build/outputs/bundle/release/*.aab | grep -E "jar verified|CN=" | head -3
          mkdir -p out
          cp composeApp/build/outputs/bundle/release/*.aab "out/FunLearn-$VERSION_NAME-$VERSION_CODE.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: FunLearn-release-aab
          path: out/*.aab
          retention-days: 30

      - name: Remove the key file
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/upload-key.jks"
